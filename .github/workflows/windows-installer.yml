name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - integration/desktop-pet
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Windows model and syntax tests
        run: npm test

      - name: Build one-click NSIS installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chengbutang-Desktop-Pet-Windows-x64
          path: windows/dist/*-Setup.exe
          if-no-files-found: error

      - name: Publish tagged installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          gh release create "${{ github.ref_name }}" "$($installer.FullName)" --title "成步堂桌宠 ${{ github.ref_name }}" --notes "Windows 10/11 x64 一键安装版。下载 Setup.exe 后双击安装。"
