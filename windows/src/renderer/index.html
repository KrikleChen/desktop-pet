<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self'; script-src 'self'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>成步堂桌宠</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="pet-root" aria-label="成步堂桌宠">
      <section id="dialogue" class="dialogue hidden" role="status" aria-live="polite">
        <span id="dialogue-marker" class="dialogue-marker" aria-hidden="true"></span>
        <span id="dialogue-text" class="dialogue-text"></span>
      </section>
      <section id="unlock-toast" class="unlock-toast hidden" role="status" aria-live="polite"></section>
      <div id="objection-burst" class="objection-burst hidden" aria-hidden="true">
        <div class="objection-speed-lines"></div>
        <div class="objection-shape objection-shadow"></div>
        <div class="objection-shape objection-red"></div>
        <div class="objection-shape objection-paper"></div>
        <div class="objection-shape objection-accent"></div>
        <span class="objection-title">異議あり！</span>
      </div>

      <section id="pet-stage" aria-label="成步堂龙一，单击随机动作，双击异议，拖动可移动">
        <img id="pet-image" draggable="false" alt="成步堂龙一">
      </section>

      <section id="ordered-hud" class="ordered-hud hidden" role="status" aria-live="polite"></section>

      <section id="cross-controls" class="cross-controls hidden" aria-label="交叉询问控制">
        <button id="cross-previous" type="button">上一句</button>
        <button id="cross-next" type="button">下一句</button>
        <button id="cross-object" class="object" type="button">异议</button>
        <button id="cross-close" class="close" type="button" aria-label="结束交叉询问">×</button>
      </section>

      <section id="court-panel" class="court-panel hidden" aria-label="法庭记录">
        <header>
          <h1>法庭记录</h1>
          <button id="court-close" type="button" aria-label="关闭法庭记录">×</button>
        </header>
        <div id="court-list" class="court-list"></div>
      </section>
    </main>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
